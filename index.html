<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cycling Transit Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Cycling Transit Data</h1>
          <p>Dashboard for Super Tuesday and Super Sunday cycling counts.</p>
        </div>
        <div class="toolbar">
          <div class="toolbar-row">
            <label for="dataset-filter">Map Layer</label>
            <select id="dataset-filter">
              <option value="all">All Sites</option>
              <option value="st">Super Tuesday (Commuter)</option>
              <option value="ss">Super Sunday (Recreation)</option>
            </select>
          </div>
          <div class="toolbar-row search-row">
            <label for="site-search">Find Site</label>
            <div class="search-group">
              <input id="site-search" list="site-search-options" type="search" placeholder="Search by site_id or council" />
              <datalist id="site-search-options"></datalist>
              <button id="site-search-button" type="button">Locate</button>
            </div>
          </div>
        </div>
      </header>

      <main class="layout-grid">
        <section class="map-panel card">
          <div id="map"></div>
          <div id="status-banner" class="status-banner">Loading workbooks...</div>
        </section>

        <aside class="detail-panel card">
          <div id="empty-state" class="empty-state">
            <h2>Select a count location</h2>
            <p>Click a map marker to inspect intersection geometry and count trends.</p>
          </div>

          <div id="detail-state" class="hidden">
            <div class="site-header">
              <h2 id="site-title"></h2>
              <span id="site-chip" class="chip"></span>
            </div>
            <p id="site-meta" class="muted"></p>

            <section class="block">
              <div class="inset-controls">
                <h3>Intersection Inset</h3>
                <label for="inset-zoom">
                  Inset zoom
                  <input id="inset-zoom" type="range" min="14" max="18" step="1" value="16" />
                  <span id="inset-zoom-value">16</span>
                </label>
              </div>
              <canvas id="intersection-canvas" width="520" height="260"></canvas>
              <p id="inset-note" class="muted"></p>
            </section>

            <section class="block">
              <div class="chart-controls">
                <h3>Time Series</h3>
                <div class="chart-toolbar">
                  <div class="mode-toggle">
                    <label><input type="radio" name="chart-mode" value="day" checked /> Single day</label>
                    <label><input type="radio" name="chart-mode" value="year" /> All years</label>
                  </div>
                  <div class="split-controls" role="group" aria-label="Split by">
                    <span class="split-label">Split by:</span>
                    <label><input id="split-mode" type="checkbox" /> Mode of transport</label>
                    <label><input id="split-gender" type="checkbox" /> Gender</label>
                  </div>
                </div>
              </div>

              <div id="chart"></div>
            </section>

            <section class="block">
              <div class="chart-controls">
                <h3>Directional Data</h3>
                <label class="select-label" for="date-select">
                  Count date
                  <select id="date-select"></select>
                </label>
              </div>
              <p id="directional-summary" class="muted"></p>
              <div id="directional-chart"></div>
              <div id="directional-matrix" class="matrix-wrap"></div>
            </section>
          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
