<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experimental Network Flow | Cycling Transit Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <div class="app-shell experimental-shell">
      <header class="topbar">
        <div>
          <h1>Experimental</h1>
          <p>Inferred network flow between count sites using road labels and volume continuity.</p>
          <nav class="page-nav" aria-label="Pages">
            <a href="index.html">Dashboard</a>
            <a class="active" href="experimental.html" aria-current="page">Experimental</a>
          </nav>
        </div>
        <div class="toolbar">
          <div class="toolbar-row">
            <label for="dataset-filter">Dataset</label>
            <select id="dataset-filter">
              <option value="all" selected>All Sites</option>
              <option value="st">Super Tuesday (Commuter)</option>
              <option value="ss">Super Sunday (Recreation)</option>
            </select>
          </div>
          <div class="toolbar-row">
            <label for="city-filter">City / Council</label>
            <select id="city-filter">
              <option value="all" selected>All Cities</option>
            </select>
          </div>
        </div>
      </header>

      <main class="experimental-grid">
        <section class="card panel">
          <div class="panel-header">
            <h2>Network Model Controls</h2>
          </div>
          <div class="model-controls">
            <label for="edge-threshold" class="select-label">
              Edge threshold
              <input id="edge-threshold" type="range" min="0" max="100" step="1" value="10" />
              <span id="edge-threshold-label" class="mono">10%</span>
            </label>
            <label for="leakage-penalty" class="select-label">
              Leakage penalty
              <input id="leakage-penalty" type="range" min="0" max="100" step="1" value="45" />
              <span id="leakage-penalty-label" class="mono">0.45</span>
            </label>
          </div>
        </section>

        <section class="card panel">
          <div class="panel-header">
            <h2>Static Network</h2>
            <label class="select-label" for="static-aggregation">
              Aggregation
              <select id="static-aggregation">
                <option value="year" selected>Single year</option>
                <option value="average">All-years average</option>
              </select>
            </label>
            <label class="select-label" for="static-date">
              Count year
              <select id="static-date"></select>
            </label>
          </div>
          <p id="static-summary" class="muted"></p>
          <div id="static-map" class="network-map"></div>
        </section>

        <section class="card panel">
          <div class="panel-header">
            <h2>Temporal Network</h2>
            <label class="select-label" for="temporal-aggregation">
              Aggregation
              <select id="temporal-aggregation">
                <option value="year" selected>Single year</option>
                <option value="average">All-years average</option>
              </select>
            </label>
            <label class="select-label" for="temporal-date">
              Count year
              <select id="temporal-date"></select>
            </label>
          </div>

          <div class="temporal-controls">
            <button id="time-prev" type="button">Prev</button>
            <input id="time-slider" type="range" min="0" max="0" step="1" value="0" />
            <button id="time-next" type="button">Next</button>
            <button id="time-play" type="button">Play</button>
            <span id="time-label" class="time-label">--:--</span>
          </div>

          <p id="temporal-summary" class="muted"></p>
          <div id="temporal-map" class="network-map"></div>
        </section>
      </main>

      <div id="status-banner" class="status-banner">Loading datasets...</div>
    </div>

    <script type="module" src="src/experimental.js"></script>
  </body>
</html>
